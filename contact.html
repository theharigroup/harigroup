<div class="grid sm:grid-cols-2 gap-4">
<input class="px-3.5 py-2.5 roundedx-lg border text-xs outline-none focus:ring-2 focus:ring-amber-400" placeholder="Your Name" required="" type="text"/>

</div>
<input class="w-full px-3.5 py-2.5 roundedx-lg border text-xs outline-none focus:ring-2 focus:ring-amber-400" placeholder="Subject" required="" type="text"/>
<textarea class="w-full px-3.5 py-2.5 roundedx-lg border text-xs outline-none focus:ring-2 focus:ring-amber-400" placeholder="Message" required="" rows="4"></textarea>
<button class="px-6 py-3 roundedx-lg bg-navy-800 text-white font-bold text-xs uppercase" type="submit">Send Message</button>
