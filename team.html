          function createProfileCard(person) {
            return `
              <div class="bg-white rounded-[2px] p-6 border border-slate-200 text-center shadow-sm">

                <img
                  class="w-90 h-90 rounded-[3px] mx-auto mb-4 border- border-amber-400 object-cover"

                  alt="${person.name}"
                />

                <h3
                  class="font-bold text-slate-700"
                  style="display: flex; align-items: center; justify-content: flex-start; gap: 8px; font-size: 18px; text-align: left; width: 100%;"
                >
                  ${person.name}
                </h3>

                <div
                  style="background-color: #facc15; width: 50px; height: 3px; margin-top: 4px;"
                ></div>

                <p
                  class="text-[13px] font-bold text-slate-500 mt-2 text-left"
                  style="display: flex; align-items: center; gap: 6px;"
                >
                  ${person.degree}
                </p>

                <p
                  class="text-[13px] text-slate-500 mt-1 text-left"
                  style="display: flex; align-items: center; gap: 6px;"
                >
                  ${person.position}
                </p>

                <div class="icon-links" style="margin-top: 10px;">

                  ${person.email ? `
                    <a
                      href="mailto:${person.email}"
                      aria-label="Email ${person.name}"
                    >
                      <i class="fa-solid fa-envelope"></i>
                    </a>
                  ` : ""}

                  ${person.scholar ? `
                    <a
                      href="${person.scholar}"
                      target="_blank"
                      rel="noopener noreferrer"
                      aria-label="Google Scholar profile"
                    >
                      <i class="fa-brands fa-google-scholar"></i>
                    </a>
                  ` : ""}

                  ${person.orcid ? `
                    <a
                      href="${person.orcid}"
                      target="_blank"
                      rel="noopener noreferrer"
                      aria-label="ORCID profile"
                    >
                      <i class="fa-brands fa-orcid"></i>
                    </a>
                  ` : ""}

                </div>

              </div>
            `;
          }

          // ==========================================
          // AUTOMATICALLY DISPLAY PROFILES BY SECTION
          // ==========================================

          document.getElementById("postdoc-grid").innerHTML =
