<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hari Group | Chemical Inventory</title><link rel="stylesheet" href="inventory.css"></head><body><main><header><a href="index.html">← Hari Group</a><h1>Chemical Inventory</h1><p>Authorized Hari Group members only</p></header><section id="auth"><h2>Member sign in</h2><form id="login"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button>Sign in</button></form><p id="loginError" role="alert"></p></section><section id="portal" hidden><div class="top"><p id="member"></p><button id="logout">Sign out</button></div><h2>Find a chemical</h2><form id="search"><select id="type"><option value="name">Name</option><option value="cas">CAS number</option><option value="barcode">Barcode</option></select><input id="query" placeholder="Enter chemical name, CAS or barcode" required><button>Search</button></form><p id="message" role="status"></p><div class="table-wrap"><table><thead><tr><th>Chemical</th><th>CAS</th><th>Container size</th><th>Location</th><th>Barcode</th><th>Supplier</th></tr></thead><tbody id="results"></tbody></table></div><div class="cards"><article><h3>Orders</h3><div id="orders"></div></article><article><h3>Watchlists</h3><div id="watchlists"></div></article></div><p>For adding containers, importing spreadsheets and changing orders, use <a href="https://app.cheminventory.net" target="_blank" rel="noopener">ChemInventory</a>.</p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="config.js"></script><script src="inventory.js"></script></body></html>
