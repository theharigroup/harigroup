<style>

</style>
<script>
// =====================================================================================
// ADD ALUMNI HERE. Cards: { name, email, destination }.  Internship students: just names.
// =====================================================================================
const ALUMNI = [
  { title: "Project Associates", type: "card", people: [
    { name: "Kousik Das", email: "kousikam216@gmail.com", destination: "PhD at University of Regensburg, Germany" },
    { name: "Abilash Pedada", email: "abhilashpedada.cool98@gmail.com", destination: "PhD at Johannes Gutenberg-Universität Mainz, Germany" },
    { name: "Buddhadeb Sahana", email: "buddhadebsahana31@gmail.com", destination: "PhD at University of Regensburg, Germany" }
  ]},
  { title: "BS-MS Students", type: "card", people: [
    { name: "Subrat Kumar Mishra", email: "subratmishra@alum.iisc.ac.in", destination: "PhD at NTU, Singapore" },
    { name: "Aksar Ali", email: "aksarali@alum.iisc.ac.in", destination: "PhD at RWTH Aachen, Germany" },
    { name: "Nakul Abhay Bapat", email: "nakulabhay@alum.iisc.ac.in", destination: "PhD at EPFL, Switzerland" },
    { name: "Manish R. Sarkar", email: "manishranjan@iisc.ac.in", destination: "Master's Thesis at EPFL, Switzerland" },
    { name: "Arjun Buragohain", email: "barjun@iisc.ac.in", destination: "PhD at University of Texas at Dallas, USA" }
  ]},
  { title: "Internship Students", type: "list", people: [
    "Rudra N. Dasmahapatra","Karthika T T","Ankita Narain","Supratik Ghosh","Akash Rajesh","Shelly","Gayathri K G","Ayisha T A","Maelle Thouzery","Anurag Sarkar","Kasmita Singha","Souptik Das","Deepshikha Bhowmik","Sai Jaswanth Kumar","Neha N. Patil","Aditya Patnaik","Srikala Korukonda","Subraja S.H.R","Pawaki Verma","Riya Fernandes","Koustav Arandhara","Shlok Asgola"
  ]}
];

// ==== DO NOT EDIT BELOW =====
const heading = t => `<div style="display:flex;align-items:center;gap:12px;margin-bottom:18px;width:100%"><h3 class="font-bold text-slate-700" style="font-size:20px;margin:0;white-space:nowrap">${t}</h3><div style="display:flex;align-items:center;gap:3px"><div style="width:2px;height:15px;background-color:#96ADC5"></div><div style="height:3px;width:50px;background-color:#facc15"></div></div></div>`;
const card = p => `<div class="bg-white p-6 border border-slate-200 text-center hover:scale-[1.02] transition duration-300 shadow-sm flex flex-col items-center">
  <h4 class="font-bold text-slate-700" style="font-size:18px">${p.name}</h4>
  <div style="background-color:#facc15;width:50px;height:3px;margin:8px 0 12px"></div>
  ${p.email ? `<a class="alumni-email" href="mailto:${p.email}"><i class="fa-solid fa-envelope mr-1.5"></i>${p.email}</a>` : ""}
  ${p.destination ? `<p class="text-[13px] text-slate-500 mt-3"><i class="fa-solid fa-briefcase mr-1.5 text-slate-400"></i>${p.destination}</p>` : ""}
</div>`;
let aFilter = "all", aQuery = "";
function renderAlumni() {
  const q = aQuery.trim().toLowerCase();
  const txt = p => typeof p === "string" ? p : [p.name, p.email, p.destination].join(" ");
  let total = 0;
  document.getElementById("alumni-root").innerHTML = ALUMNI.map(g => {
    if (aFilter !== "all" && aFilter !== g.title) return "";
    const list = g.people.filter(p => !q || txt(p).toLowerCase().includes(q));
    if (!list.length) return "";
    total += list.length;
    return `<section>${heading(g.title)}${
      g.type === "card"
        ? `<div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-6">${list.map(card).join("")}</div>`
        : `<ol class="grid sm:grid-cols-2 lg:grid-cols-4 gap-x-6 gap-y-2 bg-white border border-slate-200 shadow-sm p-6 text-[14px] text-slate-600 list-decimal list-inside">${list.map(n => `<li>${n}</li>`).join("")}</ol>`
    }</section>`;
  }).join("") || `<p class="text-center text-slate-500 py-10">No matching alumni.</p>`;
}
function renderChips() {
  const items = [{ key: "all", label: "All" }].concat(ALUMNI.map(g => ({ key: g.title, label: g.title })));
  const wrap = document.getElementById("chips");
  wrap.innerHTML = items.map((i, n) => `<button type="button" class="chip whitespace-nowrap ${i.key === aFilter ? "on" : ""}" data-i="${n}">${i.label}</button>`).join("");
  wrap.querySelectorAll("button").forEach(b => b.addEventListener("click", () => { aFilter = items[+b.dataset.i].key; renderChips(); renderAlumni(); }));
}
document.getElementById("search").addEventListener("input", e => { aQuery = e.target.value; renderAlumni(); });
renderChips(); renderAlumni();
</script>
