name: Sync team to booking members
on:
  push:
    branches: [main]
    paths: [team.html]
  workflow_dispatch:
    inputs:
      send_invites:
        description: Email set-your-password invitations to newly added people
        type: boolean
        default: false
      invite_all:
        description: Also invite every member who has no login account yet (use once for the first run)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Check the service key secret is set
        id: key
        env:
          K: ${{ secrets.PORTAL_SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$K" ]; then
            echo "::warning::Secret PORTAL_SUPABASE_SERVICE_KEY is not set (repo Settings > Secrets and variables > Actions). Skipping sync."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Add new team members to the booking system
        if: steps.key.outputs.ok == 'true'
        env:
          SUPABASE_URL: https://kknmrxopxnhirntmnwhb.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.PORTAL_SUPABASE_SERVICE_KEY }}
          SEND_INVITES: ${{ github.event_name == 'push' || inputs.send_invites || inputs.invite_all }}
          INVITE_ALL: ${{ inputs.invite_all }}
        run: node scripts/sync-booking-members.mjs
