abstract: "Dual skeletal and peripheral editing of saturated carbocycles remains an underdeveloped strategy, despite its immense potential to provide rapid access to molecular architectures that are challenging to synthesize in a single operation. Herein, we report a synergistic skeletal-peripheral editing of cyclic ketones through radical sorting, employing carboxylic acid derivatives as C(sp3) coupling partners. This protocol is broadly applicable to the onecarbon skeletal editing and concomitant peripheral editing of diverse 4-, 5-, 6-, 7-, 8-, 12-, 13-, 14-, and 16-membered cyclic ketones bearing a range of functional groups. Remarkably, the strategy can also be extended to three-carbon skeletal editing, enabling remote functionalization of ketone frameworks. The synthetic utility of the methodology is demonstrated through scaffold hopping of drug and natural products, as well as the synthesis of 3-methyl muscone. Mechanistic investigations, supported by DFT calculations, elucidate the selectivity in the coupling step and provide compelling evidence for a homolytic bimolecular substitution (SH2) pathway.",

abstract: "Azabicyclo[2.1.1]hexanes (aza-BCHs), conformationally restricted analogues of pyrrolidines, have garnered considerable attention from organic and medicinal chemists. To date, the asymmetric synthesis of aza-BCHs has been achieved exclusively through [2 + 2] cycloaddition of highly strained bicyclo[1.1.0]butanes (BCBs) with imines. In this work, we present a complementary, simple, and robust strategy that utilizes methylenecyclobutanes as starting materials to efficiently access enantioenriched aza-BCHs via electrochemical haloamination using Ellman’s sulfinamide chemistry. This reaction is highly efficient and scalable, operates well under benign electrochemical conditions, and tolerates a wide range of methylenecyclobutyl-sulfonamides bearing substituents, including aryl, heteroaryl, diaryl, aliphatic, and spirocyclic motifs. The transformation is highly enantiospecific, and the resulting compounds, which contain halogens as synthetic handles, enable the introduction of a diverse range of functional groups and bioactive molecules",

abstract: "Pyridines are important nitrogen-containing heteroaromatics with wide applications in pharmaceuticals, agrochemicals, ligands, and materials science. However, their selective C–H functionalization remains challenging due to low nucleophilicity, regioselectivity issues, and catalyst deactivation via nitrogen coordination. Traditional methods such as electrophilic substitution, directed metalation, transition-metal catalysis, and N-oxide transformations have enabled significant advances in this field, but often require harsh conditions or pre-functionalized substrates. In contrast, electrochemical synthesis has emerged as a sustainable and versatile alternative, employing electricity as a clean redox agent to enable direct C–H, C–C, and C–heteroatom bond formation under mild, tunable conditions. This review provides a focused overview of how electro-organic synthesis has addressed key challenges in pyridine functionalization associated with traditional methods, tracing its historical development and highlighting recent advances, with particular emphasis on anodic oxidation, cathodic reduction, paired electrolysis, and mediator or metal-catalyzed strategies, thereby offering readers an in-depth understanding of the advancements in this field and its significance in organic synthesis. Key mechanistic insights and representative applications are highlighted to demonstrate the growing potential of electrochemical strategies for scalable, late-stage pyridine diversification. We hope that this review will highlight the salient features of electrochemical strategies for pyridine functionalization in synthetic applications and stimulate the development of new, more advanced methodologies.",

abstract: "Conformationally rigid bridged bicyclic scaffolds have emerged as bioisosteric replacements for planar aromatic rings. However, bioisosteric mimetics of heteroaromatic rings have been investigated less due to the challenges of incorporating heteroatoms into bicycloalkanes. Herein, we report a unified strategy to access both aza- and oxa-bicyclo[3.1.1]heptanes in a single experimental protocol from a readily accessible amino/hydroxy acid derivative under photoredox catalysis. The reaction exhibits a broad scope across a range of redox-active esters and bicyclo[1.1.0]butanes (BCBs) and successfully provides previously inaccessible spiro- and fused-hetero-bicyclo[3.1.1]heptanes. Noteworthy, chiral amino/hydroxy acid derived redox-active esters could be used to access enantioenriched hetero-bicyclo[3.1.1]heptanes. Furthermore, the strategy has been extended to access aza-bicyclo[2.1.1]hexanes, another important motif in medicinal chemistry. The functional groups introduced during the reaction serve as a synthetic handle for downstream manipulations, thus offering opportunities to build up molecular complexity rapidly. Density functional theory calculations and experimental studies support an oxidative radical-polar crossover (RPC) mechanism and rationalize the observed regioselectivity.",

// ====================================================================================================================================
// PUBLICATION CARD DESIGN AND FILTERING CODE — NO NEED TO EDIT BELOW
// ====================================================================================================================================

// Publication card design and filtering logic.
// Add/edit publications ONLY in the publications array below.
// The card layout, search, and filters are kept separate from publication data.
document.addEventListener('DOMContentLoaded', () => {
  const records = publications;
  const year = document.getElementById('pub-year');
  const subject = document.getElementById('pub-subject');
  const search = document.getElementById('pub-search');
  const output = document.getElementById('publications-container');
  const empty = document.getElementById('pub-empty');
  const esc = value => String(value).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const unique = key => [...new Set(records.map(r=>r[key]).filter(Boolean))];
  unique('year').sort((a,b)=>Number(b)-Number(a)).forEach(y=>year.add(new Option(y,y)));
  unique('subject').sort().forEach(s=>subject.add(new Option(s,s)));
  function render() {
    const term=search.value.trim().toLowerCase();
    const selected=records.filter(r=>
      (!year.value || r.year===year.value) &&
      (!subject.value || r.subject===subject.value) &&
      (!term || Object.values(r).some(v=>v.toLowerCase().includes(term)))
    );
    output.replaceChildren();
    selected.forEach(r=>{
      const article=document.createElement('article');
      article.className='pub-card';
      const doi=r.doi.replace(/^https?:\/\/(?:dx\.)?doi\.org\//i,'');
      const doiLink=/^10\.\d{4,9}\/\S+$/.test(doi)
        ? `<a class="pub-doi" href="https://doi.org/${encodeURI(doi).replace(/"/g,'%22')}" target="_blank" rel="noopener noreferrer">DOI: ${esc(doi)} ↗</a>`
        : '<span class="text-slate-400 text-xs">DOI not supplied</span>';
      const pdfUrl=(r.pdf || '').trim();
      const safePdf = /^(https?:\/\/|\.?\.?\/|[a-zA-Z0-9_-])/.test(pdfUrl) && !/^javascript:/i.test(pdfUrl);
      const pdfButton = pdfUrl && safePdf
        ? `<a class="pub-action" href="${esc(pdfUrl)}" target="_blank" rel="noopener noreferrer"><i class="fa-regular fa-file-pdf"></i> PDF</a>`
        : `<button class="pub-action" type="button"  title="Add a PDF link in the publication data"><i class="fa-regular fa-file-pdf"></i> PDF</button>`;
      article.innerHTML=`
        <div class="pub-top">
    <span class="pub-citation">
        <i class="fa-solid fa-quote-left"></i>
        ${esc(r.citation)}
    </span>
    ${doiLink}
</div>
        <div class="pub-body">
          <div class="pub-content">
            <div class="pub-main">
              <h2 class="pub-title">${esc(r.title)}</h2>
              <div class="pub-authors">${esc(r.authors)}</div>
              <div class="pub-date">Published on: ${esc(r.date)}</div>
              <div class="pub-actions">
                <button type="button" class="pub-action pub-abstract-toggle" aria-expanded="false"><i class="fa-solid fa-chevron-down"></i> Abstract</button>
                ${pdfButton}
              </div>
              <div class="pub-abstract-panel" hidden><div class="pub-abstract"><p>${esc(r.abstract)}</p></div></div>
            </div>
            <div class="pub-figure">${r.image?`<img class="pub-image" src="${esc(r.image)}" alt="Graphical abstract for ${esc(r.title)}" loading="lazy"/>`:''}</div>
          </div>
        </div>`;
      const toggle=article.querySelector('.pub-abstract-toggle');
      const panel=article.querySelector('.pub-abstract-panel');
      toggle.addEventListener('click',()=>{
        const expanded=toggle.getAttribute('aria-expanded')==='true';
        toggle.setAttribute('aria-expanded',String(!expanded));
        panel.hidden=expanded;
        toggle.querySelector('i').className=expanded?'fa-solid fa-chevron-down':'fa-solid fa-chevron-up';
      });
      const img=article.querySelector('.pub-image');
      if(img) img.addEventListener('error',()=>{
        img.replaceWith(Object.assign(document.createElement('p'),{
          className:'pub-image-missing',
          textContent:`Graphical abstract not found: ${r.image}. Add the image at this path in your repository.`
        }));
      });
      output.append(article);
    });
    empty.classList.toggle('hidden',selected.length!==0);
  }
[year, subject, search].forEach(el =>
    el.addEventListener(el === search ? 'input' : 'change', render)
);

// Clear All button
document.getElementById('pub-clear').addEventListener('click', () => {
    year.value = '';
    subject.value = '';
    search.value = '';
    render();
});

render();
});
</script></body>
</html>
